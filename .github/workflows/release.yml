name: Release

# Publish the merged main commit via Run workflow on main. The job runs in the
# `marketplace` environment: it is limited to main and waits for the owner's
# approval, and VSCE_PAT exists only there. The release tag is created by the
# job itself. Missing credentials fail instead of reporting success.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate release commit and version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert(/^\d+\.\d+\.\d+$/.test(version), 'Release requires a stable version');
          const tag = `v${version}`;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          assert(changelog.includes(`## [${version}]`), 'Missing release notes');
          const notes = changelog.split(`## [${version}]`)[1].split('\n## [')[0];
          const existing = spawnSync('git', ['rev-parse', '--verify', '--quiet', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' });
          if (existing.status === 0) assert.equal(existing.stdout.trim(), process.env.GITHUB_SHA, 'Existing tag points to another commit');
          else assert.equal(existing.status, 1, 'Unable to verify release tag');
          writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, notes.slice(notes.indexOf('\n')).trim());
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=${tag}\nVSIX=copilot-cost-lens-${version}.vsix\n`);
          JS
      - name: Require Marketplace credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: test -n "$VSCE_PAT" || { echo '::error::VSCE_PAT is missing'; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run vsix
      - run: npm run verify-package
      - name: Record artifact checksum
        run: sha256sum "$VSIX" > "$VSIX.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-vsix
          path: |
            *.vsix
            *.vsix.sha256
          if-no-files-found: error
      - name: Publish verified VSIX to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "$VSIX"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release cut by hand before the Marketplace upload keeps its notes
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$VSIX" "$VSIX.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$VSIX" "$VSIX.sha256" \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
